name: TWRP Build (Archytas arm64)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Minimal TWRP manifest URL'
        required: false
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'Manifest branch (twrp-12.1 = TWRP 3.7.x)'
        required: false
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'Device tree URL (arm64 fork)'
        required: false
        default: 'https://github.com/victormc-dev/twrp_device_xiaomi_Archytas'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: false
        default: 'main'
      DEVICE_PATH:
        description: 'Device path in source tree'
        required: false
        default: 'device/xiaomi/Archytas'
      DEVICE_NAME:
        description: 'Device codename'
        required: false
        default: 'Archytas'
      MAKEFILE_NAME:
        description: 'Lunch target'
        required: false
        default: 'omni_Archytas'
      BUILD_TARGET:
        description: 'Build target (recovery)'
        required: false
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "Manifest: ${{ github.event.inputs.MANIFEST_URL }} (${{ github.event.inputs.MANIFEST_BRANCH }})"
        echo "Device: ${{ github.event.inputs.DEVICE_TREE_URL }} (${{ github.event.inputs.DEVICE_TREE_BRANCH }})"
        echo "Target: ${{ github.event.inputs.MAKEFILE_NAME }} ${{ github.event.inputs.BUILD_TARGET }}.img"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "twrp-builder"
        git config --global user.email "twrp-builder@users.noreply.github.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check Build Tree
      uses: haya14busa/action-cond@v1
      id: buildtree
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
        if_true: twrp
        if_false: omni

    - name: Sync Device Dependencies
      run: |
        bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies
        repo sync -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        make clean
        echo "=== DEBUG: env vars ==="
        echo "TARGET_NO_RECOVERY=$TARGET_NO_RECOVERY BOARD_USES_RECOVERY_AS_BOOT=$BOARD_USES_RECOVERY_AS_BOOT BOARD_RECOVERYIMAGE_PARTITION_SIZE=$BOARD_RECOVERYIMAGE_PARTITION_SIZE"
        echo "=== DEBUG: combined ninja ==="
        ls -la out/combined-*.ninja 2>/dev/null || echo "no combined ninja yet"
        echo "=== DEBUG: recovery targets in ninja ==="
        ninja -f out/combined-*.ninja -t targets 2>/dev/null | grep -iE "recovery\.img|recoveryimage" | head -5 || echo "ninja file not found"
        echo "=== DEBUG: product out before ==="
        ls -la out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ 2>/dev/null | head -15 || echo "no product out"
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "=== DEBUG: product out after ==="
        ls -la out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ 2>/dev/null | head -15
        find out -name "*.img" 2>/dev/null | head -10
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: twrp-arm64-${{ github.run_id }}
        tag_name: twrp-arm64-${{ github.run_id }}
        body: |
          Archytas arm64 TWRP (TWRP 3.7.x)
          Manifest: ${{ github.event.inputs.MANIFEST_URL }} (${{ github.event.inputs.MANIFEST_BRANCH }})
          Kernel: 64-bit Image.gz-dtb (boot-archytas-wifi.img)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
