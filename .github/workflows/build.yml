name: Build Archytas (Wi-Fi) 64-bit Kernel

on:
  workflow_dispatch:
    inputs:
      modules_only:
        description: 'Fast lane: skip the kernel build, only rebuild the 4 connectivity .ko (~3 min instead of ~11)'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
      build_stage:
        description: 'Which boot image to build (ignored in the fast lane)'
        type: choice
        options:
          - both
          - stage1
          - stage2
        default: both
      variant:
        description: 'Kernel source line: pure (pinned main) or kernelsu (agui kernelsu branch, incl. KernelSU + ksu fixes)'
        type: choice
        options:
          - pure
          - kernelsu
        default: pure
      wlan_cam:
        description: 'WLAN power-save: 1 = force CAM (never sleep, lowest latency, more battery); 0 = leave callbacks intact (battery-friendly)'
        type: choice
        options:
          - '1'
          - '0'
        default: '1'
  push:
    branches: [ main ]
    # Don't burn an ~11 min runner when a push cannot change the build output.
    # Only paths that are NOT referenced anywhere in the build chain are listed
    # -- i.e. docs, this repo's dev-time self-check harness, the CI helper
    # scripts and the offline DTB analysis tools. The build chain (build.yml +
    # build_connectivity_modules.sh) only touches these port/ files:
    #   patch_adrp_reloc.py, patch_led_pmic_blink.py, patch_wifi_dtb.py,
    #   patch_wifi_powersave.py, make_wifi_template.py,
    #   elf_symbols.py, elf_debug_share.py, build_connectivity_modules.sh,
    #   k61v1_64_archytas_defconfig, wifi_stock.dtb, 4g_stock.dtb
    # so none of the below may appear here. GitHub skips the run only when EVERY
    # changed path matches, so a doc tweak committed together with a real change
    # still builds. verify_build_script.py asserts both halves of this contract.
    # workflow_dispatch and pull_request are deliberately NOT filtered: the fast
    # lane must stay manually runnable, and a PR should always be validated.
    paths-ignore:
      - '**/*.md'
      - 'port/verify_build_script.py'
      - 'port/ci_*.py'
      - 'port/dtb_*.py'
      - 'port/analyze_oem_diff.py'
      - 'port/check_ramdisk.py'
      - 'port/dump_relocs.py'
      - 'port/ext4_read.py'
  pull_request:

# Allow the workflow to upload artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout this repo (port/ scripts + defconfig + Wi-Fi DTB)
        uses: actions/checkout@v4

      # PINNED on purpose. This is a third-party tree whose `main` moves under
      # us: on 2026-10-18 agui4541 merged our LED fix (PR #4, folded into
      # main as PR #5, commit d0fbbf77ec07c), which silently invalidated the
      # unpatched anchor patch_led_pmic_blink.py looks for and killed run
      # #39095201648 within 31 seconds. Reproducibility matters more than
      # auto-tracking here -- a boot image that flashes onto a device must come
      # from a tree whose contents we have actually read.
      #   4a4e59ed42548cc3af43bf85a2effb503fb8ab58
      #   = merge of PR #10 (byf3332): adds the BQ25601 charger driver
      #     (stock-chip init, OTG state, registered BQ driver data); sits on
      #     top of PR #9 (2200 mAh battery capacity report). Moved by the
      #     agui-sync cron on 2026-10-28.
      #   Previous pin d0fbbf77ec = "fixed 2 bugs: bad led by victormc-dev &
      #     wrong timestamp by byf" (merge of PR #5): LED software-blink
      #     fallback + dynamic build timestamp; still part of this tree.
      # Pinned via agui's auto-sha-<10 hex> TAG rather than the raw SHA:
      # github.com refuses `git fetch origin <sha>`, so actions/checkout cannot
      # fetch a bare commit object with fetch-depth: 1 (run #39096304238 died
      # exactly there). The tag is generated per commit, so it is immutable in
      # practice, and its name encodes the commit -- which
      # port/verify_build_script.py cross-checks.
      # To move the pin: fetch agui4541/archimedes-kernel-64, read
      # `git log --oneline <old>..main`, re-run port/verify_build_script.py,
      # then bump the ref and the comment together.
      #
      # variant=kernelsu: track agui's `kernelsu` BRANCH (not a tag). That line
      # moves fast (KernelSU is re-based there) and agui's auto-sha tags on it
      # have been force-updated, so a tag pin is unreliable; branch tracking is
      # the deliberate choice. The kernelsu branch forks BEFORE the LED fix
      # (merge-base 4aeb891), so patch_led_pmic_blink.py below re-applies it --
      # its anchor is intact there (verified 2026-10-26). It already carries
      # CONFIG_KEYBOARD_GPIO, the Wi-Fi DMA fix and KernelSU incl. the ksu
      # init/execveat/manager fixes (PR #8, b7ae78e). Our own defconfig is
      # copied over the kernel's, so kernel-side defconfig diffs do not matter.
      - name: Checkout 4G 64-bit kernel source (agui4541/archimedes-kernel-64)
        uses: actions/checkout@v4
        with:
          repository: agui4541/archimedes-kernel-64
          ref: ${{ github.event.inputs.variant == 'kernelsu' && 'kernelsu' || 'auto-sha-4a4e59ed4254' }}
          path: kernel
          fetch-depth: 1

      - name: Install cross toolchain and build deps
        run: |
          sudo apt-get update
          # binutils-aarch64-linux-gnu is pulled in by gcc anyway, but the
          # module step now needs aarch64-linux-gnu-strip by name (it strips
          # debug info the way INSTALL_MOD_STRIP=1 does), so ask for it.
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential bc flex bison \
            libssl-dev python3 git ca-certificates
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-strip --version | head -1

      - name: Copy Archytas (Wi-Fi) defconfig into kernel tree
        run: |
          cp port/k61v1_64_archytas_defconfig \
             kernel/arch/arm64/configs/k61v1_64_archytas_defconfig
          ls -l kernel/arch/arm64/configs/k61v1_64_archytas_defconfig

      # MUST come before the kernel build. The patch edits
      # arch/arm64/kernel/module.c, which is compiled INTO the kernel, so applying
      # it after Image.gz-dtb (as an earlier revision did, from inside the module
      # script) produces a boot image whose loader still refuses ADRP relocations
      # -- the connectivity .ko files would keep failing with
      # "unsupported RELA relocation: 275" / -ENOEXEC. Idempotent either way.
      - name: Patch kernel so the module loader handles ADRP relocations
        run: |
          python3 port/patch_adrp_reloc.py "$GITHUB_WORKSPACE/kernel"
          grep -n "ARCHYTAS_ADRP_RELOC" kernel/arch/arm64/kernel/module.c

      # MUST come before the kernel build: mtk_leds.c is compiled INTO the
      # kernel (CONFIG_MTK_LEDS=y), so the fix has to be inside Image.gz-dtb.
      # The red notification LED is routed to the PMIC ISINK1 path by the
      # stock DTS; mt_led_blink_pmic() only supports 8 discrete periods
      # (max 60 ms), so any normal notification blink was clamped to
      # freqsel=28 (~16.7 Hz) and the LED strobed. The patch refuses
      # out-of-range periods so led_blink_set() falls back to a software
      # timer blink at the requested period. Idempotent either way -- and it
      # also recognises the tree already carrying upstream's own copy of the
      # same fix, which is what the pinned commit above does.
      - name: Patch LED driver so notification blinks fall back to a software timer
        run: |
          python3 port/patch_led_pmic_blink.py "$GITHUB_WORKSPACE/kernel"
          # Gate on the two semantic effects, NOT on our marker. Upstream merged
          # the same fix themselves (agui4541 PR #5), so a marker-only grep fails
          # on a tree that is already correct -- which is exactly how run
          # #39095201648 died. Either way the source must now refuse >60 ms
          # periods and propagate that refusal to the LED core.
          grep -n "(led->blink_on_time + led->blink_off_time) >" \
            kernel/drivers/misc/mediatek/leds/mt6765/mtk_leds.c
          grep -n "return mt_led_blink_pmic(" \
            kernel/drivers/misc/mediatek/leds/mt6765/mtk_leds.c

      # NOTE on the fast lane (modules_only=true): port/build_connectivity_modules.sh
      # does not build the kernel at all -- it only compiles the four out-of-tree
      # .ko files. The slow part of this workflow has always been Image.gz-dtb above
      # it, so the fast lane simply skips that step and lets the module script run
      # `defconfig` + `modules_prepare` itself (~1-3 min) when the out-tree is cold.
      # Use it when the boot image is already built/flashed and you are iterating on
      # the connectivity drivers only.
      - name: Build kernel (Image.gz-dtb)
        if: ${{ github.event.inputs.modules_only != 'true' }}
        working-directory: kernel
        env:
          JOBS: "4"
          CROSS_COMPILE: aarch64-linux-gnu-
          # Old 4.9 tree under a modern GCC: keep both target and host-tool warnings non-fatal.
          HOSTCFLAGS: "-fcommon -Wno-error"
          HOSTCXXFLAGS: "-fcommon -Wno-error"
          KCFLAGS: "-Wno-error"
          VARIANT: ${{ github.event.inputs.variant || 'pure' }}
        run: |
          # Replicate build_archimedes.sh's proven steps but with the Archytas defconfig
          # (that script hardcodes the 4G 'archimedes' defconfig name, so we call make directly):
          # defconfig -> KernelSU on/off per variant -> olddefconfig -> Image.gz-dtb
          # agui's build_archimedes.sh ksu lane does exactly `scripts/config --enable CONFIG_KSU`
          # after defconfig (drivers/kernelsu/Kconfig: depends on OVERLAY_FS, which our
          # defconfig has: CONFIG_OVERLAY_FS=y), so the kernelsu variant mirrors it.
          OUT="$PWD/out-archytas"
          mkdir -p "$OUT/include"
          ln -sfn "$PWD/include/dt-bindings" "$OUT/include/dt-bindings"
          make -C "$PWD" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" \
               k61v1_64_archytas_defconfig
          # scripts/config lives in the kernel source tree root (not in O= dir)
          KCONFIG="$PWD/scripts/config"
          [[ -x "$KCONFIG" ]] || KCONFIG="perl $KCONFIG"
          if [[ "$VARIANT" = kernelsu ]]; then
            $KCONFIG --file "$OUT/.config" --enable CONFIG_KSU
          else
            # Keep the pure lane genuinely free of KernelSU even if the checkout carries it.
            $KCONFIG --file "$OUT/.config" --disable CONFIG_KSU
          fi
          make -C "$PWD" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" olddefconfig
          make -C "$PWD" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" KCFLAGS="-Wno-error" \
               -j"$JOBS" Image.gz-dtb
          ls -l "$OUT/arch/arm64/boot/Image.gz-dtb"

      - name: Build connectivity kernel modules (wmt/wlan/bt)
        env:
          KERNEL: kernel
          KOUT: kernel/out-archytas
          # 1 in the fast lane: the script prepares the out-tree itself (modules_prepare)
          # instead of requiring a full kernel build to have produced it.
          MODULES_ONLY: ${{ github.event.inputs.modules_only == 'true' && '1' || '0' }}
          # 1 (default) = force CAM / never sleep; 0 = battery-friendly (leave callbacks).
          WLAN_FORCE_CAM: ${{ github.event.inputs.wlan_cam }}
        run: |
          # Builds the four AArch64 connectivity .ko files (wmt_drv, wmt_chrdev_wifi,
          # wlan_drv_gen4m, bt_drv) from agui's pinned external repos + 4.9 compat patches.
          # The checked-out kernel source already carries agui's Wi-Fi DTS/EMI/MPU/CONNSYS
          # fixes, so only the out-of-tree modules are produced here.
          #
          # It ALSO patches arch/arm64/kernel/module.c to compile the ADRP relocation
          # handlers in unconditionally (see step 2e in the script): the target kernel
          # runs with CONFIG_ARM64_ERRATUM_843419=y, which otherwise makes it refuse any
          # module containing an ADRP reloc with "unsupported RELA relocation: 275".
          # -mcmodel=large is already applied and does NOT remove them.
          bash port/build_connectivity_modules.sh "$KERNEL" "$KOUT"

      - name: Summarise connectivity modules
        run: |
          OUT=kernel/out-archytas/connectivity-modules
          {
            echo "## Connectivity modules"
            echo
            echo "| module | size |"
            echo "|---|---|"
            for f in "$OUT"/*.ko; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            if [ "${{ github.event.inputs.modules_only }}" = "true" ]; then
              echo "Fast lane: the kernel was NOT rebuilt, so no boot image is in this artifact."
              echo "Flash the boot image from an earlier full run (it already carries the ADRP fix)."
            else
              echo "Full run: boot images below already include the ADRP relocation fix."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$OUT"

      # The Wi-Fi ROM DTB declares reserved-memory/wifi-reserve-memory as a
      # *plain* no-map region ("mediatek,wifi-reserve-memory" only), so the
      # Gen4M WLAN core's axiDmaSetup() -> of_reserved_mem_device_init() aborts
      # with -ENODEV/-EINVAL and mtk_wmt_probe() short-circuits before it ever
      # registers the WMT wlan callbacks -- no wlan0, no errors beyond the -19.
      # patch_wifi_dtb.py adds "shared-dma-pool" + a fixed "reg" + a phandle and
      # binds it from the wifi@18000000 node, reproducing the node the newer 4G
      # firmware DTB (port/4g_stock.dtb) ships for the same SoC. Everything else
      # in the Wi-Fi board DTB is preserved byte-for-byte, notably the charger
      # current limits which legitimately differ between the two boards.
      - name: Patch the Wi-Fi DTB (reserved-memory DMA pool for the Gen4M driver)
        if: ${{ github.event.inputs.modules_only != 'true' }}
        run: |
          python3 port/patch_wifi_dtb.py \
            --input port/wifi_stock.dtb \
            --output port/wifi_archytas.dtb
          ls -l port/wifi_stock.dtb port/wifi_archytas.dtb

      - name: Package boot images
        if: ${{ github.event.inputs.modules_only != 'true' }}
        env:
          STAGE: ${{ github.event.inputs.build_stage || 'both' }}
          KERNEL: kernel/out-archytas/arch/arm64/boot/Image.gz-dtb
          TPL: kernel/tools/archimedes-boot-template-32MiB.img
        run: |
          # Build selector: both (default) / stage1 / stage2
          case "$STAGE" in
            stage1)
              python3 kernel/package_archimedes_boot.py \
                --template "$TPL" --kernel "$KERNEL" \
                --output boot-archytas-wifi-stage1.img
              ;;
            stage2)
              python3 port/make_wifi_template.py \
                --template "$TPL" --wifi-dtb port/wifi_archytas.dtb \
                --output wifi-template-32MiB.img
              python3 kernel/package_archimedes_boot.py \
                --template wifi-template-32MiB.img --kernel "$KERNEL" \
                --output boot-archytas-wifi.img
              ;;
            *)
              python3 kernel/package_archimedes_boot.py \
                --template "$TPL" --kernel "$KERNEL" \
                --output boot-archytas-wifi-stage1.img
              python3 port/make_wifi_template.py \
                --template "$TPL" --wifi-dtb port/wifi_archytas.dtb \
                --output wifi-template-32MiB.img
              python3 kernel/package_archimedes_boot.py \
                --template wifi-template-32MiB.img --kernel "$KERNEL" \
                --output boot-archytas-wifi.img
              ;;
          esac

      - name: Upload boot images and connectivity modules
        if: ${{ github.event.inputs.modules_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: archytas-wifi-boot-and-modules
          path: |
            boot-archytas-wifi-stage1.img
            boot-archytas-wifi.img
            kernel/out-archytas/connectivity-modules/*.ko
          if-no-files-found: error

      - name: Upload connectivity modules (fast lane)
        if: ${{ github.event.inputs.modules_only == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: archytas-wifi-modules-only
          path: kernel/out-archytas/connectivity-modules/*.ko
          if-no-files-found: error

# Flashing notes (not done by CI):
#   - Flash boot-archytas-wifi.img (or stage1) to the boot partition with MTKClient.
#   - dtbo partition MUST use the Wi-Fi OEM dtbo.bin (do NOT use the 4G one).
#   - Disable AVB: mtk w vbmeta --disable-verification
#   - The boot image must come from a run that included the ADRP relocation fix in
#     arch/arm64/kernel/module.c (every non-fast-lane run does). Without it the
#     connectivity .ko files fail to insmod with -ENOEXEC / "unsupported RELA
#     relocation: 275". So: flash once from a full run, then use the fast lane
#     (modules_only=true) to iterate on the .ko files alone.
#   - See port/ARCHYTAS_PORT.md and port/flash_archytas.sh for the full runbook.
