name: Build Archytas (Wi-Fi) 64-bit Kernel

on:
  workflow_dispatch:
    inputs:
      modules_only:
        description: 'Fast lane: skip the kernel build, only rebuild the 4 connectivity .ko (~3 min instead of ~11)'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
      build_stage:
        description: 'Which boot image to build (ignored in the fast lane)'
        type: choice
        options:
          - both
          - stage1
          - stage2
        default: both
  push:
    branches: [ main ]
  pull_request:

# Allow the workflow to upload artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout this repo (port/ scripts + defconfig + Wi-Fi DTB)
        uses: actions/checkout@v4

      - name: Checkout 4G 64-bit kernel source (agui4541/archimedes-kernel-64)
        uses: actions/checkout@v4
        with:
          repository: agui4541/archimedes-kernel-64
          ref: main
          path: kernel
          fetch-depth: 1

      - name: Install cross toolchain and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu build-essential bc flex bison \
            libssl-dev python3 git ca-certificates
          aarch64-linux-gnu-gcc --version | head -1

      - name: Copy Archytas (Wi-Fi) defconfig into kernel tree
        run: |
          cp port/k61v1_64_archytas_defconfig \
             kernel/arch/arm64/configs/k61v1_64_archytas_defconfig
          ls -l kernel/arch/arm64/configs/k61v1_64_archytas_defconfig

      # MUST come before the kernel build. The patch edits
      # arch/arm64/kernel/module.c, which is compiled INTO the kernel, so applying
      # it after Image.gz-dtb (as an earlier revision did, from inside the module
      # script) produces a boot image whose loader still refuses ADRP relocations
      # -- the connectivity .ko files would keep failing with
      # "unsupported RELA relocation: 275" / -ENOEXEC. Idempotent either way.
      - name: Patch kernel so the module loader handles ADRP relocations
        run: |
          python3 port/patch_adrp_reloc.py "$GITHUB_WORKSPACE/kernel"
          grep -n "ARCHYTAS_ADRP_RELOC" kernel/arch/arm64/kernel/module.c

      # NOTE on the fast lane (modules_only=true): port/build_connectivity_modules.sh
      # does not build the kernel at all -- it only compiles the four out-of-tree
      # .ko files. The slow part of this workflow has always been Image.gz-dtb above
      # it, so the fast lane simply skips that step and lets the module script run
      # `defconfig` + `modules_prepare` itself (~1-3 min) when the out-tree is cold.
      # Use it when the boot image is already built/flashed and you are iterating on
      # the connectivity drivers only.
      - name: Build kernel (pure variant, Image.gz-dtb)
        if: ${{ github.event.inputs.modules_only != 'true' }}
        working-directory: kernel
        env:
          JOBS: "4"
          CROSS_COMPILE: aarch64-linux-gnu-
          # Old 4.9 tree under a modern GCC: keep both target and host-tool warnings non-fatal.
          HOSTCFLAGS: "-fcommon -Wno-error"
          HOSTCXXFLAGS: "-fcommon -Wno-error"
          KCFLAGS: "-Wno-error"
        run: |
          # Replicate build_archimedes.sh's proven steps but with the Archytas defconfig
          # (that script hardcodes the 4G 'archimedes' defconfig name, so we call make directly):
          # defconfig -> disable KernelSU -> olddefconfig -> Image.gz-dtb
          OUT="$PWD/out-archytas"
          mkdir -p "$OUT/include"
          ln -sfn "$PWD/include/dt-bindings" "$OUT/include/dt-bindings"
          make -C "$PWD" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" \
               k61v1_64_archytas_defconfig
          # scripts/config lives in the kernel source tree root (not in O= dir)
          KCONFIG="$PWD/scripts/config"
          [[ -x "$KCONFIG" ]] || KCONFIG="perl $KCONFIG"
          $KCONFIG --file "$OUT/.config" --disable CONFIG_KSU
          make -C "$PWD" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" olddefconfig
          make -C "$PWD" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" KCFLAGS="-Wno-error" \
               -j"$JOBS" Image.gz-dtb
          ls -l "$OUT/arch/arm64/boot/Image.gz-dtb"

      - name: Build connectivity kernel modules (wmt/wlan/bt)
        env:
          KERNEL: kernel
          KOUT: kernel/out-archytas
          # 1 in the fast lane: the script prepares the out-tree itself (modules_prepare)
          # instead of requiring a full kernel build to have produced it.
          MODULES_ONLY: ${{ github.event.inputs.modules_only == 'true' && '1' || '0' }}
        run: |
          # Builds the four AArch64 connectivity .ko files (wmt_drv, wmt_chrdev_wifi,
          # wlan_drv_gen4m, bt_drv) from agui's pinned external repos + 4.9 compat patches.
          # The checked-out kernel source already carries agui's Wi-Fi DTS/EMI/MPU/CONNSYS
          # fixes, so only the out-of-tree modules are produced here.
          #
          # It ALSO patches arch/arm64/kernel/module.c to compile the ADRP relocation
          # handlers in unconditionally (see step 2e in the script): the target kernel
          # runs with CONFIG_ARM64_ERRATUM_843419=y, which otherwise makes it refuse any
          # module containing an ADRP reloc with "unsupported RELA relocation: 275".
          # -mcmodel=large is already applied and does NOT remove them.
          bash port/build_connectivity_modules.sh "$KERNEL" "$KOUT"

      - name: Summarise connectivity modules
        run: |
          OUT=kernel/out-archytas/connectivity-modules
          {
            echo "## Connectivity modules"
            echo
            echo "| module | size |"
            echo "|---|---|"
            for f in "$OUT"/*.ko; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            if [ "${{ github.event.inputs.modules_only }}" = "true" ]; then
              echo "Fast lane: the kernel was NOT rebuilt, so no boot image is in this artifact."
              echo "Flash the boot image from an earlier full run (it already carries the ADRP fix)."
            else
              echo "Full run: boot images below already include the ADRP relocation fix."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$OUT"

      - name: Package boot images
        if: ${{ github.event.inputs.modules_only != 'true' }}
        env:
          STAGE: ${{ github.event.inputs.build_stage || 'both' }}
          KERNEL: kernel/out-archytas/arch/arm64/boot/Image.gz-dtb
          TPL: kernel/tools/archimedes-boot-template-32MiB.img
        run: |
          # Build selector: both (default) / stage1 / stage2
          case "$STAGE" in
            stage1)
              python3 kernel/package_archimedes_boot.py \
                --template "$TPL" --kernel "$KERNEL" \
                --output boot-archytas-wifi-stage1.img
              ;;
            stage2)
              python3 port/make_wifi_template.py \
                --template "$TPL" --wifi-dtb port/wifi_stock.dtb \
                --output wifi-template-32MiB.img
              python3 kernel/package_archimedes_boot.py \
                --template wifi-template-32MiB.img --kernel "$KERNEL" \
                --output boot-archytas-wifi.img
              ;;
            *)
              python3 kernel/package_archimedes_boot.py \
                --template "$TPL" --kernel "$KERNEL" \
                --output boot-archytas-wifi-stage1.img
              python3 port/make_wifi_template.py \
                --template "$TPL" --wifi-dtb port/wifi_stock.dtb \
                --output wifi-template-32MiB.img
              python3 kernel/package_archimedes_boot.py \
                --template wifi-template-32MiB.img --kernel "$KERNEL" \
                --output boot-archytas-wifi.img
              ;;
          esac

      - name: Upload boot images and connectivity modules
        if: ${{ github.event.inputs.modules_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: archytas-wifi-boot-and-modules
          path: |
            boot-archytas-wifi-stage1.img
            boot-archytas-wifi.img
            kernel/out-archytas/connectivity-modules/*.ko
          if-no-files-found: error

      - name: Upload connectivity modules (fast lane)
        if: ${{ github.event.inputs.modules_only == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: archytas-wifi-modules-only
          path: kernel/out-archytas/connectivity-modules/*.ko
          if-no-files-found: error

# Flashing notes (not done by CI):
#   - Flash boot-archytas-wifi.img (or stage1) to the boot partition with MTKClient.
#   - dtbo partition MUST use the Wi-Fi OEM dtbo.bin (do NOT use the 4G one).
#   - Disable AVB: mtk w vbmeta --disable-verification
#   - The boot image must come from a run that included the ADRP relocation fix in
#     arch/arm64/kernel/module.c (every non-fast-lane run does). Without it the
#     connectivity .ko files fail to insmod with -ENOEXEC / "unsupported RELA
#     relocation: 275". So: flash once from a full run, then use the fast lane
#     (modules_only=true) to iterate on the .ko files alone.
#   - See port/ARCHYTAS_PORT.md and port/flash_archytas.sh for the full runbook.
